name: ETF数据连接测试
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/etf-data-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 测试FtShare权限（不输出密钥）
        env:
          FTSHARE_API_KEY: ${{ secrets.FTSHARE_API_KEY || secrets.FTSHAREAPIKEY }}
        shell: python
        run: |
          import os,json,urllib.request,urllib.parse,urllib.error,datetime,pathlib,time,sys
          key=os.environ.get("FTSHARE_API_KEY","").strip()
          if not key:raise RuntimeError("FtShare Secret未配置")
          tz=datetime.timezone(datetime.timedelta(hours=8))
          now=datetime.datetime.now(tz)
          args={"symbol":"510300.SH","interval_unit":"Day","adjust_kind":"None","since_ts_millis":int((now-datetime.timedelta(days=100)).timestamp()*1000),"until_ts_millis":int(now.timestamp()*1000),"limit":80}
          url="https://market.ft.tech/gateway/api/v1/market/data/etf-candlesticks?"+urllib.parse.urlencode(args)
          for attempt in range(3):
              try:
                  req=urllib.request.Request(url,headers={"FTSHARE_API_KEY":key,"Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=40) as response:payload=json.load(response)
                  break
              except urllib.error.HTTPError as e:
                  print("FtShare HTTP",e.code)
                  try:
                      err=json.loads(e.read(8000));print("诊断:",str(err.get("message",err.get("msg",""))).replace(key,"[REDACTED]")[:600])
                  except (ValueError,AttributeError):pass
                  if e.code in (400,401,403) or attempt==2:raise RuntimeError("FtShare请求失败；HTTP "+str(e.code)) from None
              except (urllib.error.URLError,TimeoutError):
                  if attempt==2:raise RuntimeError("FtShare网络连接失败") from None
              time.sleep(2*(attempt+1))
          if payload.get("code")!=200 or not isinstance(payload.get("data"),list):raise RuntimeError("FtShare返回业务错误或非预期数据结构")
          safe=[]
          for row in payload["data"]:
              if not isinstance(row,dict):raise RuntimeError("日线记录格式错误")
              ts=row.get("ts_millis")
              if not isinstance(ts,(int,float)):raise RuntimeError("日线缺失时间戳")
              item={k:row[k] for k in ["ts_millis","open","high","low","close","volume","turnover"] if k in row}
              item["date"]=datetime.datetime.fromtimestamp(ts/1000,tz).date().isoformat()
              for k in ["open","high","low","close"]:
                  if float(item[k])<=0:raise RuntimeError("无效价格")
              safe.append(item)
          safe.sort(key=lambda x:x["ts_millis"])
          if not safe:raise RuntimeError("接口成功但无日线记录")
          result={"source":"FtShare免费版单只ETFK线","symbol":"510300.SH","capturedAt":now.isoformat(),"latestMarketDate":safe[-1]["date"],"count":len(safe),"rows":safe}
          pathlib.Path("etf-probe.json").write_text(json.dumps(result,ensure_ascii=False,indent=2))
          print(json.dumps({k:v for k,v in result.items() if k!="rows"},ensure_ascii=False))
          print("最近5根日线:",json.dumps(safe[-5:],ensure_ascii=False))
          if safe[-1]["date"]!=now.date().isoformat():print("注意：最新行情日期不同于北京时间当天，不当作今日行情。")
      - uses: actions/upload-artifact@v6
        with:
          name: etf-probe-${{ github.run_id }}
          path: etf-probe.json
          if-no-files-found: error
          retention-days: 7
